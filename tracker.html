<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracker | ERNIE-KESS ENTERPRISE</title>
  <meta name="description" content="Track and manage customer orders for airtime, data bundles, Mashup, bills and send money at ERNIE-KESS ENTERPRISE in Ashaiman, Ghana.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="order.css">
</head>
<body>

  <header>
    <h1>Order Tracker</h1>
    <p>For shop use only</p>
  </header>

  <section>
    <form id="trackForm">
      <label>Customer name</label>
      <input type="text" id="tName" required>

      <label>Service</label>
      <select id="tService">
        <option>Airtime</option>
        <option>Data</option>
        <option>Mashup</option>
        <option>Bill Payment</option>
        <option>Send Money</option>
      </select>

      <label>Number / account</label>
      <input type="tel" id="tRecipient" required>

      <label>Total paid (GH₵)</label>
      <input type="number" id="tTotal" min="0" step="0.01" required>

      <button type="submit" class="btn">Add Order</button>
    </form>
  </section>

  <section>
    <h2>Today</h2>
    <p id="summary"></p>
  </section>

  <section>
    <h2>Orders</h2>
    <div id="list"></div>
  </section>

  <script src="tracker.js"></script>
</body>
</html>
